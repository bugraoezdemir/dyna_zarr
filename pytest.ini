[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short --cov=dyna_zarr --cov-report=term-missing
markers =
    slow: slow integration tests
    zarrista: needs the optional zarrista backend (pip install "dyna-zarr[zarrista]")
    gpu: needs CuPy and a CUDA device (pip install "dyna-zarr[gpu-cuXX]")
