[workspace]
members = [".", "crates/transforms", "crates/arrays"]
resolver = "2"

[workspace.package]
edition = "2021"
license = "MIT"
repository = "https://github.com/bugraoezdemir/dyna_zarr"

# The Python package: dyna-zarr-core (Python module dyna_zarr_core), dyna-zarr's
# engine (Workplan WP15, decision DR-1). The work lives in the two library crates
# below, which know nothing about Python; this crate only binds them.
[package]
name = "dyna-zarr-core"
version = "0.0.1"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "Native (Rust) engine for dyna-zarr: coordinate transformations and lazy array operations on Zarr arrays, built on zarrs"

[lib]
name = "dyna_zarr_core"
crate-type = ["cdylib"]

[dependencies]
# abi3: one wheel per platform for every Python >= 3.11, as micro-reader-core
pyo3 = { version = "0.29", features = ["extension-module", "abi3-py311"] }
dyna-zarr-transforms = { path = "crates/transforms" }
dyna-zarr-arrays = { path = "crates/arrays" }
serde_json = "1"
# The module's allocator (MIT). Measured 2026-11-18 on Windows: with the system
# allocator every decoded chunk (~1 MB) came from freshly mapped memory, and reads took
# 2-3.5x as long on one thread (a 512 x 512 plane region 45 -> 12.8 ms, a whole array
# 1195 -> 613 ms; TensorStore 22 / 739 ms).
mimalloc = "0.1"

[profile.release]
lto = true
codegen-units = 1
