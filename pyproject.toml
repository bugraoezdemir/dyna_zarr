[build-system]
requires = ["setuptools>=65", "wheel"]
build-backend = "setuptools.build_meta"

# Auto-discover every subpackage under src/. The previous explicit
# `packages = ["dyna_zarr"]` shipped ONLY the top-level modules: the
# `dyna_zarr.operations` subpackage was left out of the wheel entirely, so an
# installed copy raised `ModuleNotFoundError: No module named
# 'dyna_zarr.operations'` on import (it worked locally only because the editable
# install points at the source tree). Discovery keeps new subpackages included
# automatically.
[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"

[project]
name = "dyna-zarr"
version = "0.0.9"
description = "A lightweight library for lazy operations on Zarr arrays without task graph overhead"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "Bugra Oezdemir", email = "bugraa.ozdemir@gmail.com"},
]
# Kept in sync with the GitHub repository topics.
keywords = [
    "zarr", "ome-zarr", "lazy-evaluation", "ndarray", "out-of-core",
    "memory-bounded", "chunked-array", "image-processing", "bioimage", "microscopy",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Image Processing",
    "Topic :: Scientific/Engineering :: Visualization",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Distributed Computing",
]

# Floors are MEASURED, not guessed: each is the lowest release with which the full core
# suite passes when every dependency is installed at its floor on the oldest supported
# Python (uv pip install --resolution lowest-direct, Python 3.11). The couplings that
# set them, since none is visible from dyna's own imports:
#   zarr>=3.1.5, tifffile>=2025.5.21 - TIFF reads go through tifffile's ZarrTiffStore,
#     which implements zarr 3's Store ABC as of zarr 3.1.5 (tifffile only states that in
#     its [zarr] extra, which is not installed here). Older tifffile is not a zarr-3 store
#     at all; newer tifffile on older zarr fails to instantiate.
#   numpy>=1.26 - required by zarr 3.1.5.
#   scipy>=1.10 - the first scipy installable alongside numpy>=1.26.
#   tensorstore>=0.1.62 - the first built against NumPy 2; older wheels fail to import
#     under NumPy 2 while declaring no upper bound, so pip would pair them with it.
#   tensorstore != 0.1.77 .. 0.1.84 - those releases CRASH AT INTERPRETER EXIT
#     (0xC0000409) after any S3 access on Windows: the work completes, but the process
#     exits with a failure code, breaking scripts and CI. Reproduced with tensorstore
#     alone (no dyna) against an S3 emulator; 0.1.62, 0.1.71-0.1.76 and 0.1.85 exit
#     cleanly. Excluded on every platform (Linux/macOS not verified either way).
# (The unpinned `tensorstore`/`tifffile` used to resolve to 0.1.0 / 0.1.0 at the floor.)
dependencies = [
    "zarr>=3.1.5",
    "numpy>=1.26",
    "scipy>=1.10",
    "tensorstore>=0.1.62,!=0.1.77,!=0.1.78,!=0.1.79,!=0.1.80,!=0.1.81,!=0.1.82,!=0.1.83,!=0.1.84",
    "tifffile>=2025.5.21",
]

[project.optional-dependencies]
# Development TOOLING only - deliberately not the optional features. Installing a
# backend is a separate choice (`[zarrista]`, `[gpu-cuXX]`), and their tests carry
# markers so it is always visible which of them ran: see `markers` in pytest.ini
# and the `-m` selections in .github/workflows/tests.yml.
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "black>=23.0",
    "isort>=5.0",
    "mypy>=1.0",
    "ruff>=0.1.0",
    # An in-process S3 emulator, so the remote-I/O tests (tests/test_remote_io.py) run
    # in CI instead of skipping; they never touch a real cloud endpoint.
    "moto[server]>=5",
]
docs = [
    "sphinx>=5.0",
    "sphinx-rtd-theme>=1.0",
]
# Alternative storage backend (optional): Rust-backed zarr via zarrs.
# Faster than the default tensorstore path in every configuration benchmarked
# (see benchmarks/ and reports/zarrista_bugs/), but PINNED to an exact version:
# 0.1.0 is beta, its zarr-v2 support rides on the undocumented
# `Array.from_metadata` path, and it has two silent failure modes the backend
# guards against. Re-run tests/test_zarrista_backend.py before moving the pin.
# obstore is what reaches object stores: zarrista exposes s3://, gs://, az:// and
# http:// only through its async API over an obstore ObjectStore. Local paths work
# without it, so a read of a remote URL raises a targeted ImportError if it is absent.
# numpy>=2.1: zarrista hands data over via DLPack and calls __dlpack__(max_version=...),
# which NumPy gained in 2.1. zarrista declares no numpy requirement itself, so on
# numpy<2.1 EVERY zarrista read/write fails at runtime; the floor has to live here.
zarrista = ["zarrista==0.1.0", "obstore>=0.11", "numpy>=2.1"]
# GPU execution (optional). CuPy ships CUDA-version-specific wheels and pip CANNOT
# auto-detect your CUDA, so pick the extra that matches `nvidia-smi` (CUDA Version):
#   pip install dyna-zarr[gpu-cu11]   # CUDA 11.x
#   pip install dyna-zarr[gpu-cu12]   # CUDA 12.x
#   pip install dyna-zarr[gpu-cu13]   # CUDA 13.x (e.g. Blackwell)
# `[gpu]` is a convenience alias for CUDA 12.x. The [ctk] extra ships the NVRTC headers
# CuPy needs to JIT kernels (without it every kernel raises "Failed to find CUDA headers").
# Auto-detect alternative (may lag new CUDA releases): pip install cupy-wheel
gpu = ["cupy-cuda12x[ctk]"]
gpu-cu11 = ["cupy-cuda11x[ctk]"]
gpu-cu12 = ["cupy-cuda12x[ctk]"]
gpu-cu13 = ["cupy-cuda13x[ctk]"]

[project.urls]
Homepage = "https://github.com/bugraoezdemir/dyna_zarr"
Documentation = "https://dyna-zarr.readthedocs.io"
