name: Tests

# Runs the test suite on every push and pull request to the main branches. It can also
# be started by hand from the Actions tab ("Run workflow"), which is how you check a
# feature branch such as `dev` BEFORE opening the merge - pick the branch in the dropdown.
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      full:
        description: "Run the wheel install-check and metadata jobs too (slower)"
        type: boolean
        default: true
      gpu:
        description: "Also run the GPU suite (needs a CUDA self-hosted runner)"
        type: boolean
        default: false

concurrency:
  # A new push to the same branch cancels an in-flight run for it.
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: pytest (py${{ matrix.python-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Every OS x every Python the package claims support for
        # (requires-python >=3.11). This package is path- and filesystem-heavy and
        # both classes of bug have bitten in practice: a Windows drive letter parsed
        # as a URL scheme, and chunk-alignment violations that surface as a
        # PermissionError only on a local Windows store. macOS is covered for the
        # same reason - it is the other case-insensitive filesystem, and a large
        # share of this package's users are on it.
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run tests
        # Core suite only: the optional backends get their own jobs below, so a
        # missing extra shows up as a missing JOB rather than as silent skips
        # inside a green run. -o addopts="": the repo's pytest config sets coverage
        # flags; the workflow decides what to run, and coverage is a separate job.
        run: python -m pytest tests/ -v -o addopts="" -m "not zarrista and not gpu"

  zarrista:
    # Its own job so the optional backend is tested AUTOMATICALLY without hiding
    # inside the core run: if the extra ever fails to install, this job goes red
    # instead of 47 tests quietly skipping under a green check.
    name: zarrista backend (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # zarrista publishes abi3 wheels for all three, so no Rust toolchain is
        # needed. All three are covered because the backend's own guard is about
        # concurrent filesystem writes, which is exactly where platforms differ.
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install with the zarrista extra
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,zarrista]"

      - name: Fail if the backend did not actually become available
        # Without this the suite below would SKIP rather than fail, which is the
        # failure mode this job exists to prevent.
        run: python -c "from dyna_zarr.backends import ZARRISTA_AVAILABLE; assert ZARRISTA_AVAILABLE, 'the [zarrista] extra installed but the backend is unavailable - its tests would silently skip'"

      - name: Run the zarrista suite
        run: python -m pytest tests/ -v -o addopts="" -m zarrista

  gpu:
    # CuPy needs a CUDA device, which GitHub's standard runners do not have, so
    # this cannot run on the default fleet. It is kept as a hand-started job:
    # point it at a self-hosted CUDA runner (change `runs-on`) to exercise the
    # `gpu`-marked tests. Until then the marker at least keeps them out of the
    # core run and makes their absence explicit rather than invisible.
    name: GPU backend (manual / self-hosted)
    if: github.event_name == 'workflow_dispatch' && inputs.gpu
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install with a CUDA extra
        # gpu-cu12 matches most current runners; change it to match the device.
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,gpu-cu12]"

      - name: Run the GPU suite
        # No `gpu`-marked tests exist yet, so pytest would exit 5 ("no tests
        # collected") and fail the job. Tolerate exactly that code, and nothing
        # else, so this starts working the moment the first GPU test is written.
        shell: bash
        run: |
          python -m pytest tests/ -v -o addopts="" -m gpu || code=$?
          if [ "${code:-0}" = "5" ]; then
            echo "::notice::no gpu-marked tests yet - add pytest.mark.gpu to the GPU path tests"
          elif [ "${code:-0}" != "0" ]; then
            exit "$code"
          fi

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install
        # With [zarrista] so the optional backend is measured rather than reported
        # as dead code. The GPU path stays out: it needs hardware this runner lacks.
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,zarrista]"

      - name: Run tests with coverage
        run: python -m pytest tests/ -o addopts="" -m "not gpu" --cov=dyna_zarr --cov-report=xml

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          fail_ci_if_error: false

  install-check:
    # Hand-started runs can skip this via the `full` input; scheduled/PR runs always run it.
    if: github.event_name != 'workflow_dispatch' || inputs.full
    # Builds the wheel, installs it into a CLEAN venv from OUTSIDE the repo, and runs the
    # suite against the RESOLVED PyPI dependencies. The jobs above use `-e .`, which tests
    # the SOURCE TREE: a module missing from the wheel is invisible there. dyna-zarr 0.0.4
    # shipped to PyPI UNIMPORTABLE for exactly this reason - `packages = ["dyna_zarr"]`
    # excluded the `dyna_zarr.operations` subpackage, so every real install died with
    # `ModuleNotFoundError`, while CI stayed green and `twine check` (metadata only)
    # passed. It was yanked and fixed in 0.0.5 via `packages.find`.
    name: Wheel install-check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Packaging faults can be platform-specific (path separators, case-folding,
        # a file that only resolves on the OS it was built on), so the wheel is
        # installed and exercised on every supported OS, not just Linux.
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      # Driven from Python rather than shell so one script covers every OS: venv
      # layouts differ (bin/ vs Scripts/), and Windows runners have no cp/ls.
      - name: Build, install into a clean venv, run the suite
        shell: python
        run: |
          import glob, os, shutil, subprocess, sys, sysconfig, tempfile

          def run(*cmd, **kw):
              print("+", " ".join(map(str, cmd)), flush=True)
              subprocess.run(cmd, check=True, **kw)

          run(sys.executable, "-m", "pip", "install", "--upgrade", "pip", "build")
          run(sys.executable, "-m", "build", "--wheel")

          # Build the venv OUTSIDE the repo so the source tree cannot satisfy imports.
          fresh = os.path.join(tempfile.mkdtemp(prefix="dz-"), "venv")
          run(sys.executable, "-m", "venv", fresh)
          # scripts land in Scripts/ on Windows and bin/ elsewhere
          bindir = "Scripts" if os.name == "nt" else "bin"
          py = os.path.join(fresh, bindir, "python.exe" if os.name == "nt" else "python")

          wheel = glob.glob(os.path.join("dist", "*.whl"))[0]
          run(py, "-m", "pip", "install", "--upgrade", "pip")
          # Extras are requested through the WHEEL's own metadata, so this also
          # proves they and their pins survive packaging - not just that they are
          # spelled correctly in pyproject.toml.
          run(py, "-m", "pip", "install", f"{wheel}[dev,zarrista]", "pytest")

          # Import every shipped subpackage explicitly: this is the check that would
          # have caught 0.0.4, and it fails loudly rather than being skipped.
          # `backends` is imported by name too - it is the newest subpackage and so
          # the most likely to be dropped by a packaging change.
          probe = (
              "import dyna_zarr, dyna_zarr.operations, dyna_zarr.io, dyna_zarr.codecs, "
              "dyna_zarr.backends;"
              "from dyna_zarr import DynamicArray, io, operations, Codecs, backends;"
              "import importlib.metadata as md;"
              "assert dyna_zarr.__version__ == md.version('dyna_zarr'), "
              "f'__version__ {dyna_zarr.__version__} != metadata {md.version(\"dyna_zarr\")}';"
              # the [zarrista] extra must have resolved, and to the pinned version:
              # this is what proves the pin binds for a real `pip install` user.
              "from dyna_zarr.backends import zarrista_backend as zb;"
              "assert zb.ZARRISTA_AVAILABLE, 'the [zarrista] extra did not resolve';"
              "assert zb.installed_version() == zb.TESTED_VERSION, "
              "f'pin resolved to {zb.installed_version()}, expected {zb.TESTED_VERSION}';"
              "print('dyna_zarr', dyna_zarr.__version__, 'imports cleanly from the wheel; "
              "zarrista', zb.installed_version(), 'pinned OK')"
          )
          outside = tempfile.mkdtemp(prefix="dz-run-")
          run(py, "-c", probe, cwd=outside)

          # Copy the tests out: running from the repo root would put ./src back on
          # sys.path and defeat the point of installing the wheel.
          dest = os.path.join(outside, "wheel_tests")
          shutil.copytree(os.path.join(os.environ["GITHUB_WORKSPACE"], "tests"), dest)
          # -m "not gpu": no CUDA device on these runners. The zarrista tests DO
          # run here, since the extra was installed from the wheel's own metadata.
          run(py, "-m", "pytest", dest, "-v", "-o", "addopts=", "-m", "not gpu",
              cwd=outside)

  lint:
    # Hand-started runs can skip this via the `full` input; scheduled/PR runs always run it.
    if: github.event_name != 'workflow_dispatch' || inputs.full
    name: Package metadata
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Build and check the distribution
        # Catches metadata that would be rejected at publish time - the same check the
        # release workflow runs, but on every push rather than once a bad version is
        # already tagged.
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          python -m twine check dist/*
