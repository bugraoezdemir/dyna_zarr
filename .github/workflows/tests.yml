name: Tests

# Runs the test suite on every push and pull request to the main branches. It can also
# be started by hand from the Actions tab ("Run workflow"), which is how you check a
# feature branch such as `dev` BEFORE opening the merge - pick the branch in the dropdown.
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      full:
        description: "Run the wheel install-check and metadata jobs too (slower)"
        type: boolean
        default: true

concurrency:
  # A new push to the same branch cancels an in-flight run for it.
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: pytest (py${{ matrix.python-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Every Python the package claims support for (requires-python >=3.11).
        os: [ubuntu-latest]
        python-version: ["3.11", "3.12", "3.13"]
        include:
          # This package is developed on Windows, and the path handling has hit
          # platform-specific issues before (a drive letter parsed as a URL scheme).
          - os: windows-latest
            python-version: "3.13"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run tests
        # -o addopts="": the repo's pytest config sets coverage flags; the workflow
        # decides what to run, and coverage is collected in the job below.
        run: python -m pytest tests/ -v -o addopts=""

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run tests with coverage
        run: python -m pytest tests/ -o addopts="" --cov=dyna_zarr --cov-report=xml

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          fail_ci_if_error: false

  install-check:
    # Hand-started runs can skip this via the `full` input; scheduled/PR runs always run it.
    if: github.event_name != 'workflow_dispatch' || inputs.full
    # Builds the wheel, installs it into a CLEAN venv from OUTSIDE the repo, and runs the
    # suite against the RESOLVED PyPI dependencies. The jobs above use `-e .`, which tests
    # the SOURCE TREE: a module missing from the wheel is invisible there. dyna-zarr 0.0.4
    # shipped to PyPI UNIMPORTABLE for exactly this reason - `packages = ["dyna_zarr"]`
    # excluded the `dyna_zarr.operations` subpackage, so every real install died with
    # `ModuleNotFoundError`, while CI stayed green and `twine check` (metadata only)
    # passed. It was yanked and fixed in 0.0.5 via `packages.find`.
    name: Wheel installs and tests pass on resolved deps
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Build, install into a clean venv, run the suite
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel
          python -m venv /tmp/fresh
          /tmp/fresh/bin/python -m pip install --upgrade pip
          /tmp/fresh/bin/python -m pip install "$(ls dist/*.whl)[dev]" pytest
          # Import every shipped subpackage explicitly: this is the check that would
          # have caught 0.0.4, and it fails loudly rather than being skipped.
          cd /tmp && /tmp/fresh/bin/python -c "
          import dyna_zarr, dyna_zarr.operations, dyna_zarr.io, dyna_zarr.codecs
          from dyna_zarr import DynamicArray, io, operations, Codecs
          print('dyna_zarr', dyna_zarr.__version__, 'imports cleanly from the wheel')
          "
          # copy the tests out: running from the repo root would put ./src back on
          # sys.path and defeat the point of installing the wheel
          cp -r "$GITHUB_WORKSPACE/tests" /tmp/wheel_tests
          cd /tmp && /tmp/fresh/bin/python -m pytest /tmp/wheel_tests -v -o addopts=""

  lint:
    # Hand-started runs can skip this via the `full` input; scheduled/PR runs always run it.
    if: github.event_name != 'workflow_dispatch' || inputs.full
    name: Package metadata
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Build and check the distribution
        # Catches metadata that would be rejected at publish time - the same check the
        # release workflow runs, but on every push rather than once a bad version is
        # already tagged.
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          python -m twine check dist/*
