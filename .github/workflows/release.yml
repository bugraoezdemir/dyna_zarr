name: Release

# Build and publish dyna_zarr to PyPI when a GitHub Release is published.
#
# Uses PyPI "Trusted Publishing" (OIDC) -- no API token stored in the repo. One-time setup:
#   1. On PyPI: project -> Publishing -> add a trusted publisher for this repo/workflow
#      (workflow filename: release.yml, environment: pypi).
#   2. In GitHub repo settings -> Environments -> create an environment named "pypi".
# Then: bump `version` in pyproject.toml, tag it, and publish a GitHub Release -> this runs.
#
# To dry-run without publishing, use workflow_dispatch (build + twine check only).

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build:
    name: Build sdist + wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
      - name: Check metadata
        run: twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    # only publish for a real release, not the manual dry-run
    if: github.event_name == 'release'
    environment: pypi
    permissions:
      id-token: write        # required for OIDC trusted publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1
